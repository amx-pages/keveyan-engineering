<!DOCTYPE html>

<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Keveyan Engineering - Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    </head>
    <body>
    <div class="wrapper">
        <div class="header">
            Keveyan Engineering
        </div>
        <div class="main">
            <div class="box">
                <div class="contact-card">
                    <h4>Contact Information</h4>
                    <div class="contact-line">Name: Haykaz Keveyan</div>
                    <div class="contact-line">Email: info@keveyanengineering.com</div>
                    <div class="contact-line">Phone: +374 77 783027</div>
                </div>
                <div id="gallery" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carousel-inner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#gallery" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#gallery" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="footer">
            © 2026 Keveyan Engineering
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        const totalImages = 9;
        const carouselInner = document.getElementById('carousel-inner');

        for (let i = 1; i <= totalImages; i++) {
            const div = document.createElement('div');
            div.classList.add('carousel-item');
            if (i === 1) {
            div.classList.add('active');
            }
            const img = document.createElement('img');
            img.src = `images/img${i}.jpg`;
            img.classList.add('d-block', 'w-100');
            div.appendChild(img);
            carouselInner.appendChild(div);
        }
        </script>
    </body>
</html>
